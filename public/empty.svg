<svg width="166" height="135" viewBox="0 0 166 135" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background ellipse -->
  <ellipse cx="83" cy="67" rx="70" ry="55" fill="#F4F5F7"/>

  <!-- Bot Head -->
  <g filter="url(#shadow)">
    <rect x="55" y="40" width="56" height="40" rx="12" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    
    <!-- Antenna -->
    <line x1="83" y1="30" x2="83" y2="40" stroke="#1A1B27" stroke-width="3" stroke-linecap="round"/>
    <circle cx="83" cy="28" r="4" fill="#1A1B27"/>
    
    <!-- Eyes -->
    <circle cx="70" cy="60" r="5" fill="#1A1B27"/>
    <circle cx="96" cy="60" r="5" fill="#1A1B27"/>
    
    <!-- Mouth -->
    <rect x="73" y="72" width="20" height="4" rx="2" fill="#D1D5DB"/>
  </g>

  <!-- Shoulders / Base -->
  <rect x="50" y="85" width="66" height="14" rx="7" fill="#E5E7EB"/>
  
  <!-- Dashed line (empty state hint) -->
  <line x1="40" y1="115" x2="126" y2="115" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="4 4"/>

  <defs>
    <filter id="shadow" x="50" y="25" width="76" height="74" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
</svg>
