<svg width="166" height="135" viewBox="0 0 166 135" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background ellipse -->
  <ellipse cx="83" cy="67" rx="70" ry="55" fill="#F4F5F7"/>

  <!-- Bot Head (calendar style for upcoming) -->
  <g filter="url(#shadow)">
    <rect x="55" y="38" width="56" height="44" rx="12" fill="white" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Antenna -->
    <line x1="83" y1="28" x2="83" y2="38" stroke="#1A1B27" stroke-width="3" stroke-linecap="round"/>
    <circle cx="83" cy="26" r="4" fill="#1A1B27"/>

    <!-- Calendar top bar -->
    <rect x="55" y="38" width="56" height="8" rx="2" fill="#E5E7EB"/>

    <!-- Calendar rings -->
    <circle cx="68" cy="42" r="2" fill="#1A1B27"/>
    <circle cx="98" cy="42" r="2" fill="#1A1B27"/>

    <!-- Eyes (excited look) -->
    <circle cx="70" cy="62" r="5" fill="#1A1B27"/>
    <circle cx="96" cy="62" r="5" fill="#1A1B27"/>

    <!-- Smile (curved upcoming smile) -->
    <path d="M73 72 C78 78, 88 78, 93 72" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Shoulders / Base -->
  <rect x="50" y="87" width="66" height="14" rx="7" fill="#E5E7EB"/>
  
  <!-- Dashed line (event timeline) -->
  <line x1="40" y1="115" x2="126" y2="115" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="4 4"/>

  <defs>
    <filter id="shadow" x="50" y="20" width="76" height="74" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
</svg>
